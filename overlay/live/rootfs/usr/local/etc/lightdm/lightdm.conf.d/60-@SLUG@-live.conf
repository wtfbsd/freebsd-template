# 60-@SLUG@-live.conf — LightDM logs the live user in (live ISO only).
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# build.sh copies this file into the stage only for the ISO and takes it
# out again: the raw image that is installed never has it, so the installed
# system shows the greeter. The user is made by rc.d/live_session.

[Seat:*]
autologin-user=live
autologin-user-timeout=0
autologin-session=xfce
