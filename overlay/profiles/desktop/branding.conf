# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# This file DOCUMENTS the contract. It installs no files: art lives in a
# separate artwork repo and is installed into the image at the prefix below,
# outside this template (which deliberately contains no art files).

# --- Palette ---------------------------------------------------------------
# Source of truth: palette.env in wtfbsd/artwork-template. The artwork repo
# renders from it; never re-embed final colors. All values are six
# hex digits (RRGGBB, no leading '#'). Product-level overrides arrive as
# BRAND_COLOR in product.conf (same six-digit format).
#
#   PRIMARY   main brand color          ACCENT   secondary highlight
#   DARK      dark background           DARK2    secondary dark shade
#   LIGHT     light background          MUTED    muted text/foreground

# --- Install prefix --------------------------------------------------------
# ARTWORK_PREFIX=/usr/local/share/@SLUG@/artwork      (build.sh substitutes the slug)
#   $ARTWORK_PREFIX/logo/         logo assets; required: logo-128.png
#                                 (greeter user image: logo-128.png)
#   $ARTWORK_PREFIX/wallpapers/   required: wallpaper-1-1920x1080.png
#                                 (greeter background)
#   $ARTWORK_PREFIX/loader/       boot loader / firmware splash assets
#   $ARTWORK_PREFIX/lightdm/      other LightDM greeter assets
#
# products: BRAND_COLOR (product.conf) drives derived art; BRAND_URL goes in
# installer footers and release pages. @DISTRO_NAME@ provides display text.
