# /usr/local/share/@SLUG@/xorg/20-scfb.conf — the X fallback of a display
# that has no DRM device.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# Without /dev/dri/card0 (a UEFI bhyve guest, or any display without a KMS
# driver) the X autoconfiguration matches modesetting, scfb and vesa
# together and exits "Cannot run in framebuffer mode. Please specify
# busIDs". This Device section pins the display to the scfb (system
# console framebuffer) driver. rc.d/xorg_fallback copies it into
# /usr/local/etc/X11/xorg.conf.d at boot when there is no DRM device, and
# removes the copy again once there is one.

Section "Device"
	Identifier "Console display"
	Driver     "scfb"
EndSection
