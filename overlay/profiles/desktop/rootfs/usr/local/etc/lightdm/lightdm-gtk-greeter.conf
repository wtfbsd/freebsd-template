# lightdm-gtk-greeter.conf — greeter branding hooks.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# @SLUG@ is substituted by build.sh. These files are provided by the
# artwork-template contract documented in ../branding.conf:
#   <prefix>/logo/logo-128.png
#   <prefix>/wallpapers/wallpaper-1-1920x1080.png
# with <prefix>=/usr/local/share/@SLUG@/artwork. No art files live in this
# repository; the artwork repo installs them at that prefix.

[greeter]
background=/usr/local/share/@SLUG@/artwork/wallpapers/wallpaper-1-1920x1080.png
default-user-image=/usr/local/share/@SLUG@/artwork/logo/logo-128.png
